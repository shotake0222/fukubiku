<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>AR動作テスト（fukubiku）</title>

<!--
  スマホでだけARが表示されない件を切り分けるための、単体で動く最小テストページ。
  Next.js/Reactを一切通さず、動作実績のある旧実装(index.html)と同じ構成で
  同じマーカー・同じ.glbを表示する。
  端末をPCに繋がなくても状況が分かるよう、判定結果を画面に大きく表示する。

    このページで出る  → アプリ側(React統合)の問題
    このページでも出ない → 端末・ブラウザ・マーカー側の問題
-->

<style>
  /* AR.jsは<body>自体に幅・高さ・負のmarginを書き込んでページ全体をずらすため、
     ここで固定して打ち消す(アプリ側と同じ対策)。 */
  html, body {
    margin: 0 !important; padding: 0 !important;
    width: 100vw !important; max-width: 100vw !important;
    height: 100vh !important; max-height: 100vh !important;
    overflow: hidden !important; background: #000 !important;
  }
  #arjs-video, .a-canvas {
    position: fixed !important; top: 0 !important; left: 0 !important;
    width: 100vw !important; height: 100vh !important;
    margin: 0 !important; transform: none !important;
  }
  #arjs-video { z-index: 0 !important; object-fit: cover !important; }
  .a-canvas { z-index: 1 !important; background: transparent !important; }
  .a-enter-vr, .a-enter-ar { display: none !important; }
  #status {
    position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
    background: rgba(0,0,0,.78); color: #7CFC7C;
    font: 13px/1.5 monospace; padding: 8px 10px; white-space: pre-wrap;
    pointer-events: none;
  }
  #status b { color: #fff; }
  #ctrl {
    position: fixed; left: 0; right: 0; bottom: 64px; z-index: 9999;
    text-align: center; padding: 8px; background: rgba(0,0,0,.6);
    font: 13px/2 sans-serif; color: #fff;
  }
  #ctrl a {
    display: inline-block; margin: 2px 3px; padding: 5px 9px;
    background: #fff; color: #111; border-radius: 999px; text-decoration: none;
  }
  #ctrl a.on { background: #2196F3; color: #fff; }
  #big {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 9999;
    text-align: center; padding: 14px 10px 24px;
    background: rgba(0,0,0,.7); color: #fff;
    font: bold 20px/1.4 sans-serif; pointer-events: none;
  }
</style>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="/vendor/aframe-ar.js"></script>
</head>

<body>
<div id="status">読み込み中...</div>
<div id="big">マーカーにカメラを向けてください</div>
<div id="ctrl">
  <div>しきい値:
    <a data-th="0">0手動</a><a data-th="1">1中央値</a><a data-th="2">2大津</a>
    <a data-th="3">3適応</a><a data-th="4">4ブラケット</a>
  </div>
</div>

<div id="scene-holder"></div>

<script>
  // ---- 設定(URLパラメータ) ----
  var P = new URLSearchParams(location.search);
  var TH = /^[0-4]$/.test(P.get('thresh') || '') ? Number(P.get('thresh')) : 2;
  // マーカー(筐体)は生産済みで変更できないため、現行のものに固定する
  var cfg = { url: '/markers/patternkuji.patt', ratio: 0.9 };

  // 切り替えリンクの設定(タップするとリロードして反映)
  function link(q) {
    var s = new URLSearchParams(location.search);
    Object.keys(q).forEach(function (k) { s.set(k, q[k]); });
    return location.pathname + '?' + s.toString();
  }
  Array.prototype.forEach.call(document.querySelectorAll('#ctrl a[data-th]'), function (a) {
    a.href = link({ thresh: a.getAttribute('data-th') });
    if (Number(a.getAttribute('data-th')) === TH) a.className = 'on';
  });

  // ---- シーンを組み立てる ----
  var scene = document.createElement('a-scene');
  scene.setAttribute('embedded', '');
  scene.setAttribute('vr-mode-ui', 'enabled: false');
  scene.setAttribute('device-orientation-permission-ui', 'enabled: false');
  scene.setAttribute('arjs',
    'sourceType: webcam; debugUIEnabled: false; detectionMode: mono; trackingMethod: best;' +
    ' patternRatio: ' + cfg.ratio + '; cameraParametersUrl: /vendor/camera_para.dat; maxDetectionRate: 30;');
  scene.setAttribute('renderer', 'alpha: true;');
  scene.innerHTML =
    '<a-marker id="mk" preset="custom" type="pattern" url="' + cfg.url + '"' +
    ' smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">' +
      '<a-box position="0 0 0" scale="0.6 0.6 0.6" material="color: #ff3355"></a-box>' +
      '<a-entity id="mdl" gltf-model="url(/presets/garagara/garagara_atari_3d.glb)"' +
      ' rotation="-90 0 0" scale="1 1 1"></a-entity>' +
    '</a-marker>' +
    '<a-entity camera></a-entity>';
  document.getElementById('scene-holder').appendChild(scene);

  // ---- しきい値モードを適用 ----
  var threshApplied = '未適用';
  var thTimer = setInterval(function () {
    var sys = scene.systems && scene.systems.arjs;
    var ctl = sys && (sys._arSession || sys.arSession) && (sys._arSession || sys.arSession).arContext
      ? ((sys._arSession || sys.arSession).arContext.arController) : null;
    if (ctl && ctl.setThresholdMode) {
      try { ctl.setThresholdMode(TH); threshApplied = '適用済(' + TH + ')'; }
      catch (e) { threshApplied = '失敗 ' + e; }
      clearInterval(thTimer);
    }
  }, 400);
  setTimeout(function () { clearInterval(thTimer); }, 15000);

  var found = 0, lost = 0, modelLoaded = false, modelError = "";
  // マーカー検出の要となるカメラパラメータを実際に取得できるか確認する
  var camParaStatus = '確認中...';
  fetch('/vendor/camera_para.dat')
    .then(function (r) { return r.ok ? r.arrayBuffer() : Promise.reject(r.status); })
    .then(function (b) { camParaStatus = 'OK (' + b.byteLength + ' bytes)'; })
    .catch(function (e) { camParaStatus = '取得失敗 ' + e; });
  var mk = scene.querySelector('#mk');
  var mdl = scene.querySelector('#mdl');
  var big = document.getElementById('big');

  mk.addEventListener('markerFound', function () {
    found++;
    big.textContent = '✅ マーカーを検出しました（' + found + '回目）';
  });
  mk.addEventListener('markerLost', function () {
    lost++;
    big.textContent = 'マーカーを見失いました（検出 ' + found + '回）';
  });
  mdl.addEventListener('model-loaded', function () { modelLoaded = true; });
  mdl.addEventListener('model-error', function (e) {
    modelError = (e && e.detail && e.detail.src) ? ('読込失敗 ' + e.detail.src) : '読込失敗';
  });

  function line(k, v) { return '<b>' + k + '</b>: ' + v + '\n'; }

  setInterval(function () {
    var v = document.querySelector('#arjs-video') || document.querySelector('video');
    var c = document.querySelector('.a-canvas');
    var s = '';
    s += line('AFRAME', typeof AFRAME !== 'undefined' ? 'OK ' + AFRAME.version : '未読込');
    s += line('AR.js', (typeof THREEx !== 'undefined' || typeof ARjs !== 'undefined') ? 'OK' : '未読込');
    if (!v) {
      s += line('カメラ', '映像要素なし（カメラ取得前 or 失敗）');
    } else {
      var st = v.srcObject, tr = st && st.getVideoTracks ? st.getVideoTracks()[0] : null;
      s += line('カメラ', v.videoWidth + 'x' + v.videoHeight + ' paused=' + v.paused + ' track=' + (tr ? tr.readyState : '-'));
      var r = v.getBoundingClientRect();
      s += line('映像位置', Math.round(r.x) + ',' + Math.round(r.y) + ' ' + Math.round(r.width) + 'x' + Math.round(r.height));
    }
    if (c) {
      var cr = c.getBoundingClientRect();
      s += line('canvas', Math.round(cr.x) + ',' + Math.round(cr.y) + ' ' + Math.round(cr.width) + 'x' + Math.round(cr.height) + ' buf=' + c.width + 'x' + c.height);
    } else {
      s += line('canvas', 'なし');
    }
    s += line('マーカー', '検出 ' + found + '回 / ロスト ' + lost + '回');
    s += line('モデル', modelLoaded ? '読込済' : (modelError || 'まだ'));
    s += line('カメラパラメータ', camParaStatus);
    s += line('使用マーカー', 'patternRatio ' + cfg.ratio);
    s += line('しきい値モード', TH + ' / ' + threshApplied);
    s += line('画面', window.innerWidth + 'x' + window.innerHeight + ' dpr=' + window.devicePixelRatio);
    s += line('body', document.body.getAttribute('style') || '(なし)');
    document.getElementById('status').innerHTML = s;
  }, 500);

  window.addEventListener('error', function (e) {
    document.getElementById('big').textContent = '⚠️ エラー: ' + (e.message || '');
  });
</script>
</body>
</html>
